	<body class="contact-page">
<canvas id="fireworks"></canvas>
<canvas id="dust"></canvas>

	<header>

	<nav class="navbar">

	<a href="index.html" class="logo">

	<span class="logo-doe">DOE</span>
	<span class="logo-designs">designs</span>

	</a>

	<ul class="nav-links">

	<li><a href="branding.html">Branding</a></li>
	<li><a href="design.html">Design</a></li>

	</ul>

	</nav>

	</header>

	<main class="page-content contact-container">

	<div class="contact-paper">


	<div class="paper-tape"></div>


	<h1 class="contact-title">
		CONTACT
	</h1>

	<form id="contactForm">

	<label>
		NAME
	</label>

	<input 
		type="text"
		name="name"
		placeholder="Your name"
		required
	>

	<label>
		EMAIL
	</label>

	<input 
		type="email"
		name="reply_to"
		placeholder="your@email.com"
		required
	>

	<label>
		MESSAGE
	</label>

	<textarea
		name="message"
		rows="6"
		placeholder="Tell me about your project..."
		required></textarea>

	</form>
	</div>
<div class="contact-subtitle">
	<p>
		Let's create something memorable.
	</p>
		</div>
	<button 
		type="submit" 
		form="contactForm"
		id="submitButton">

		SEND MESSAGE

	</button>

		</main>

<footer id="footerCopyright"></footer>


<script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>

</body>
